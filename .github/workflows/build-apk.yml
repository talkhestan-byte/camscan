name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          [ -d android ] || npx cap add android
      - name: Add plugin and permissions
        run: |
          D=android/app/src/main/java/com/camscan/app
          mkdir -p $D
          cp native/*.java $D/
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -q libvlc android/app/build.gradle || cat >> android/app/build.gradle <<'EOF'
          dependencies { implementation 'org.videolan.android:libvlc-all:3.6.0' }
          android { defaultConfig { ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } } }
          EOF
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: camscan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
