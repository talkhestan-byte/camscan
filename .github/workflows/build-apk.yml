name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          [ -d android ] || npx cap add android
          npx cap sync android
      - name: Add plugin and permissions
        run: |
          D=android/app/src/main/java/com/camscan/app
          mkdir -p $D
          cp native/CamScanPlugin.java $D/
          cp native/MainActivity.java $D/
          cp native/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: camscan-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
