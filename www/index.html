<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اسکنر دوربین</title>
<style>
 body{font-family:sans-serif;margin:0;background:#111;color:#eee}
 header{padding:12px;background:#1d1d1d;position:sticky;top:0;z-index:5}
 input{width:30%;min-width:110px;box-sizing:border-box;padding:9px;margin:2px;border-radius:6px;border:0}
 @media(max-width:520px){header button{font-size:14px;padding:10px 12px}}
 button{padding:10px 14px;border:0;border-radius:8px;background:#2f7bff;color:#fff;font-size:15px;margin:2px}
 button.g{background:#555}button.r{background:#c0392b}
 h3{margin:14px 12px 0}
 .card{margin:10px;padding:12px;background:#1d1d1d;border-radius:12px}
 .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;background:#777}
 .online{background:#2ecc71}.offline{background:#e74c3c}.auth{background:#f1c40f}
 small{color:#aaa;display:block;margin-top:4px}
 .row{margin-top:8px}
 #shot{display:none;position:fixed;inset:0;z-index:20;background:#000e;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
 #shotBox{width:100%;max-width:700px;background:#222;border-radius:12px;padding:10px;box-sizing:border-box}
 #shotImage{display:block;width:100%;max-height:75vh;object-fit:contain;background:#000}
 #shot button{width:100%;margin:8px 0 0}
</style></head><body>
<header>
 <button onclick="scan()">جستجوی دوربین‌ها</button>
 <div id="st" style="margin-top:6px;font-size:13px"></div>
</header>
<h3>⭐ دوربین‌های من</h3><div id="mine"></div>
<h3>نتایج جستجو</h3><div id="list"></div>
<div id="shot" onclick="if(event.target===this)closeSnapshot()">
 <div id="shotBox">
  <img id="shotImage" alt="تصویر ثابت دوربین">
  <button onclick="closeSnapshot()">بستن تصویر</button>
 </div>
</div>
<script src="app.js"></script>
</body></html>
